spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: foodie
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodie}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop # testing purposes - later change to 'update'
    open-in-view: false
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 2000
          timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

foodie:
  noc:
    base-url: ${NOC_BASE_URL:http://localhost:8081}
    api-token: ${NOC_API_TOKEN:}
    connect-timeout-ms: ${NOC_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${NOC_READ_TIMEOUT_MS:3000}
    max-get-retries: ${NOC_MAX_GET_RETRIES:2}

# Custom Application Properties.
app:
  jwt:
    issuer: "FoodieApp - api"
    audience: "external-systems"
    secret: "${JWT_SECRET}" # openssl rand -base64 32
    ttl-minutes: 60