<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <title>Foodie - Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="icon" type="image/png" th:href="@{/img/ico.png}" />
</head>
<body>

    <!-- ERROR / SUCCESS MESSAGES -->
    <div th:if="${param.error}" style="color: red;">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" style="color: green;">
        You have been logged out successfully.
    </div>
    <div th:if="${param.success}" style="color: green;">
        Registration successful! Please sign in.
    </div>

    <!-- LOGIN FORM (Handled automatically by Spring Security) -->
    <form th:action="@{/login}" method="post">

        <label>Username</label>
        <input type="text" name="username" required />
        <br/>

        <label>Password</label>
        <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="loginPassword" name="password" required style="width: 100%; padding-right: 50px;" />
            <button type="button" onclick="togglePassword('loginPassword', this)" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #e63946; font-weight: 600; font-size: 13px;">Show</button>
        </div>
        <br/>
        <button type="submit">Sign In</button>
    </form>

    <!-- LINK TO REGISTER FORM -->
    <p>
        Don't have an account? <a th:href="@{/register}">Register here</a>
    </p>

    <script>
        function togglePassword(fieldId, btn) {
            const passwordField = document.getElementById(fieldId);
            if (passwordField.type === "password") {
                passwordField.type = "text";
                btn.textContent = "Hide";
            } else {
                passwordField.type = "password";
                btn.textContent = "Show";
            }
        }
    </script>

</body>
</html>
