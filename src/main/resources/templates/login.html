<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <title>Foodie - Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <!-- ERROR / SUCCESS MESSAGES -->
    <div th:if="${param.error}" style="color: red;">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" style="color: green;">
        You have been logged out successfully.
    </div>
    <div th:if="${param.success}" style="color: green;">
        Registration successful! Please sign in.
    </div>

    <!-- LOGIN FORM (Handled automatically by Spring Security) -->
    <form th:action="@{/login}" method="post">

        <label>Username</label>
        <input type="text" name="username" required />
        <br/>

        <label>Password</label>
        <input type="password" name="password" required />
        <br/>

        <button type="submit">Sign In</button>
    </form>

    <!-- USEFUL LINKS -->
    <p>
        Don't have an account? <a th:href="@{/register}">Register here</a>
    </p>

</body>
</html>
