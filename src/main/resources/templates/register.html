<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Foodie - Register</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="icon" type="image/png" th:href="@{/img/ico.png}" />
</head>
<body>

    <h2>Create your Foodie Account</h2>

    <!-- REGISTER FORM -->
    <form th:action="@{/register}" th:object="${user}" method="post">

        <label>Username</label>
        <input type="text" th:field="*{username}" required />
        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: red; font-size: 13px;"></div>
        <br/>

        <label>Email</label>
        <input type="email" th:field="*{email}" required />
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red; font-size: 13px;"></div>
        <br/>

        <label>Phone Number</label>
        <input type="tel" th:field="*{mobilePhoneNumber}" required />
        <div th:if="${#fields.hasErrors('mobilePhoneNumber')}" th:errors="*{mobilePhoneNumber}" style="color: red; font-size: 13px;"></div>
        <br/>

        <label>Password</label>
        <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="registerPassword" th:field="*{passwordHash}" required style="width: 100%; padding-right: 50px;" />
            <button type="button" onclick="togglePassword('registerPassword', this)" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #e63946; font-weight: 600; font-size: 13px;">Show</button>
        </div>
        <div th:if="${#fields.hasErrors('passwordHash')}" th:errors="*{passwordHash}" style="color: red; font-size: 13px;"></div>
        <br/>

        <button type="submit">Register Account</button>
    </form>

    <p>
        Already have an account? <a th:href="@{/login}">Sign In here</a>
    </p>

    <script>
        function togglePassword(fieldId, btn) {
            const passwordField = document.getElementById(fieldId);
            if (passwordField.type === "password") {
                passwordField.type = "text";
                btn.textContent = "Hide";
            } else {
                passwordField.type = "password";
                btn.textContent = "Show";
            }
        }
    </script>
</body>
</html>
