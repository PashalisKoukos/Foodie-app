<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <title>Foodie - Registration</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
    <!--
    TODO: Implement the User Registration Form using Thymeleaf,
          following the same structure and conventions as login.html.


    2. Use Thymeleaf attributes (th:action, th:object, th:field)
       to bind the form fields to the User model.

    3. Submit the registration form using POST to the /register endpoint.

    4. Ensure all required fields have appropriate validation.

    -->

    <!--TODO: HERE IMPLEMENTATION-->

    <!-- ERROR / SUCCESS MESSAGES -->
    <div th:if="${param.error}" style="color: red;">
        Registration failed. Please check your information.
    </div>
    <div th:if="${param.success}" style="color: green;">
        Registration successful! You can now sign in.
    </div>
    <div th:if="${param.exists}" style="color: red;">
        Username or email already exists.
    </div>


    <!-- REGISTER FORM (Handled automatically by Spring Security) -->
    <form th:action="@{/register}" method="post">

        <!-- Account Type -->
        <label for="role">Account Type</label>

        <select name="role" id="role" required>
            <option value="" disabled selected>Select account type</option>
            <option value="CUSTOMER">Customer</option>
            <option value="OWNER">Owner</option>
        </select>
        <br/>

        <label>Username</label>
        <input type="text" name="username" required />
        <br/>

        <label>Email</label>
        <input type="text" name="email" required />
        <br/>

        <label>Phone Number</label>
        <input type="tel" name="mobilePhoneNumber" required />
        <br/>

        <label>Password</label>
        <input type="password" name="password" required />
        <br/>

        <button type="submit">Register Account</button>
    </form>

    <!-- USEFUL LINKS -->
    <p>
        Already have an account? <a th:href="@{/login}">Sign In here</a>
    </p>

</body>
</html>
