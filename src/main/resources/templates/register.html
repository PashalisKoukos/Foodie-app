<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Foodie - Register</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="icon" type="image/png" th:href="@{/img/ico.png}" />
</head>
<body>

    <h2>Create your Foodie Account</h2>

    <!-- ERROR / SUCCESS MESSAGES -->
    <div th:if="${param.error}" style="color: red;">
        Registration failed. Please check your information.
    </div>
    <div th:if="${param.success}" style="color: green;">
        Registration successful! You can now sign in.
    </div>
    <div th:if="${param.exists}" style="color: red;">
        Username or email already exists.
    </div>

    <!-- REGISTER FORM (Bound to User model via Thymeleaf) -->
    <form th:action="@{/register}" th:object="${user}" method="post">

        <!-- Account Type -->
        <label for="role">Account Type</label>
        <select th:field="*{role}" id="role" required>
            <option value="" disabled selected>Select account type</option>
            <option value="CUSTOMER">Customer</option>
            <option value="OWNER">Owner</option>
        </select>
        <br/>

        <label>Username</label>
        <input type="text" th:field="*{username}" required />
        <br/>

        <label>Email</label>
        <input type="email" th:field="*{email}" required />
        <br/>

        <label>Phone Number</label>
        <input type="tel" th:field="*{mobilePhoneNumber}" required />
        <br/>

        <label>Password</label>
        <input type="password" th:field="*{passwordHash}" required />
        <br/>

        <button type="submit">Register Account</button>
    </form>

    <!-- LINK TO LOGIN PAGE -->
    <p>
        Already have an account? <a th:href="@{/login}">Sign In here</a>
    </p>

</body>
</html>
