<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{../static/img/ico.png}"/>
    <title>Foodie - Error</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(
                    rgba(255, 250, 242, 0.45),
                    rgba(255, 250, 242, 0.55)
            ), url('/img/foodie_back.png') no-repeat 46% center fixed;
            background-size: cover;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .error-page {
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: calc(100% - 80px);
        }

        #errorMessage {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #555;
            margin: 0;
        }

        #errorMessage::before {
            content: "Oops!";
            display: block;
            font-size: 3.5rem;
            font-weight: 700;
            color: #ca8a27;
            margin-bottom: 10px;
        }

        .error-details {
            font-size: 0.9rem;
            color: #777;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        .home-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #a86826;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .home-link:hover {
            background-color: rgb(186 12 12 / 0.75);
        }
    </style>
</head>
<body>
    <div class="error-page">

        <p id="errorMessage">
            Something went wrong!
            <br>
            An unexpected error occurred.
        </p>

        <p class="error-details"
           th:if="${path}"
           th:text="${'Path: ' + path}">
        </p>

        <p class="error-details"
           th:if="${message}"
           th:text="${message}">
        </p>

        <a th:href="@{/}" class="home-link">
            Back to Home
        </a>

    </div>
</body>
</html>
