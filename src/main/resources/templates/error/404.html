<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Foodie - Page Not Found</title>
    <link rel="icon" type="image/png" th:href="@{../static/img/ico.png}"/>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(255, 250, 242, 0.45), rgba(255, 250, 242, 0.55)), url('/img/foodie_back.png') no-repeat 46% center fixed;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .error-404 {
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
        }

        #errorMessage {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #555;
            margin: 0;
        }

        #errorMessage::before {
            content: "404";
            display: block;
            font-size: 5rem;
            font-weight: 700;
            color: #ca8a27;
            margin-bottom: 10px;
        }

        .home-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #a86826;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .home-link:hover {
            background-color: rgb(186 12 12 / 0.75);
        }
    </style>
</head>
<body>
<div class="error-404">
    <p id="errorMessage">Oops! <br>This page doesn't exist.</p>
    <a href="/" class="home-link">Back to Home</a>
</div>
</body>
</html>
