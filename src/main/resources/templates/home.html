<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Foodie - Home</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="icon" type="image/png" th:href="@{/img/ico.png}" />
</head>
<body>

    <div class="top-nav">
        <div sec:authorize="isAnonymous()" class="auth-buttons">
            <a th:href="@{/login}" class="nav-btn login-nav-btn">Sign In</a>
            <a th:href="@{/register}" class="nav-btn register-nav-btn">Register</a>
        </div>

        <div sec:authorize="isAuthenticated()" class="user-menu">
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-btn">Sign Out</button>
            </form>
        </div>
    </div>

</body>
</html>
