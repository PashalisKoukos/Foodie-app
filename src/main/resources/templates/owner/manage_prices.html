<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Foodie - Owner Price Manager</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="icon" type="image/png" th:href="@{/img/ico.png}" />
</head>
<body>

    <div class="top-nav">
        <div sec:authorize="!isAuthenticated()" class="auth-links">
            <a th:href="@{/login}" class="nav-btn login-nav-btn">Login</a>
            <a th:href="@{/register}" class="nav-btn register-nav-btn">Register</a>
        </div>

        <div sec:authorize="isAuthenticated()" class="user-menu">
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-btn">Sign Out</button>
            </form>
        </div>
    </div>

    <main>
        <h1>Manage Prices</h1>

        <!-- Restaurant information -->
        <section>
            <h2 th:text="${restaurant.name}">Restaurant Name</h2>
        </section>

        <!-- Menu items -->
        <section>
            <h2>Menu Items</h2>

            <table>
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Current Price</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item : ${menuItems}">
                    <td th:text="${item.name}">Product Name</td>

                    <td th:text="${item.price}">0.00</td>

                    <td>
                        <button type="button">Edit Price</button>
                    </td>
                </tr>
                </tbody>
            </table>

            <p th:if="${#lists.isEmpty(menuItems)}">
                No menu items found.
            </p>
        </section>

        <a th:href="@{/owner/owner_page}">Back to Dashboard</a>

    </main>
</body>
</html>
