<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{../static/img/ico.png}"/>
    <title>Foodie - Owner Panel</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #ea580c;
            --primary-hover: #c2410c;
            --primary-soft: #fff7ed;
            --border: #e5e7eb;
            --shadow: 0 4px 14px rgba(17, 24, 39, 0.06);
            --shadow-hover: 0 14px 28px rgba(234, 88, 12, 0.12);
            --radius: 16px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(255, 250, 242, 0.55), rgba(255, 250, 242, 0.68)), url('/img/foodie_back.png') no-repeat 46% center fixed;
            color: var(--text);
            line-height: 1.5;
            padding: 32px 20px 60px;
            min-height: 100vh;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 28px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--text);
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logout-btn {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .logout-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
        }

        section {
            margin-bottom: 32px;
        }

        section > h3 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 22px;
            color: var(--text);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: var(--radius);
            padding: 36px 32px;
            min-height: 290px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 28px;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: #fdba74;
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background-color: var(--primary-soft);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .card-icon svg {
            width: 28px;
            height: 28px;
        }

        .card h4 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text);
        }

        .card p {
            font-size: 1.02rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            text-decoration: none;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 1.02rem;
            font-weight: 600;
            padding: 14px 22px;
            border-radius: 10px;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .btn-link:hover {
            background-color: var(--primary-hover);
        }

        .btn-link .arrow {
            transition: transform 0.2s ease;
        }

        .btn-link:hover .arrow {
            transform: translateX(4px);
        }
    </style>
</head>
    <body>
    <!--FIRST PAGE THAT OWNER WATCHES-->
    <div class="container">
        <header>
            <h1>Foodie - Owner Panel</h1>

            <div class="top-nav">
                <div sec:authorize="isAuthenticated()" class="user-menu">
                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <button type="submit" class="logout-btn">Sign Out</button>
                    </form>
                </div>
            </div>
        </header>

        <!--2 CHOICES : MANAGE MENU , MANAGE ORDERS-->
        <!--AI produced the 2 icon cards for better UI-->
        <main>
            <section>
                <h3>Restaurant Management</h3>
                <div class="cards-grid">
                    <div class="card">
                        <div>
                            <div class="card-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                </svg>
                            </div>
                            <h4>Menu</h4>
                            <p>Manage menu items, update prices, and toggle product availability.</p>
                        </div>
                        <a th:href="@{/owner/menu}" class="btn-link">
                            <span>Manage Menu</span>
                        </a>
                    </div>

                    <div class="card">
                        <div>
                            <div class="card-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                                </svg>
                            </div>
                            <h4>Orders</h4>
                            <p>Review incoming customer orders, accept or reject pending orders, and update order status.</p>
                        </div>
                        <a th:href="@{/owner/orders}" class="btn-link">
                            <span>View Orders</span>
                        </a>
                    </div>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
