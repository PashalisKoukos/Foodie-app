<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{../static/img/ico.png}"/>
    <title>Foodie - Manage Menu</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #ea580c;
            --primary-hover: #c2410c;
            --border: #e5e7eb;
            --success-bg: #ecfdf5;
            --success-text: #065f46;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
            --radius: 12px;
            --shadow: 0 4px 14px rgba(17, 24, 39, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(rgba(255, 250, 242, 0.55), rgba(255, 250, 242, 0.68)), url('/img/foodie_back.png') no-repeat 46% center fixed;
            color: var(--text);
            padding: 28px 20px 60px;
        }

        .container { max-width: 1080px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 22px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.92rem;
            margin-top: 2px;
        }

        .back-link {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-weight: 500;
        }

        .alert-success { background: var(--success-bg); color: var(--success-text); }
        .alert-error { background: var(--error-bg); color: var(--error-text); }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .card h3 { margin-bottom: 14px; font-size: 1.1rem; }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            align-items: end;
        }

        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.92rem;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
        }

        .btn:hover { background: var(--primary-hover); }

        .btn-secondary { background: #374151; }
        .btn-secondary:hover { background: #1f2937; }

        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .badge-avail {
            background: #dcfce7;
            color: #166534;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-unavail {
            background: #fee2e2;
            color: #991b1b;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .inline-form { display: inline-flex; gap: 6px; align-items: center; }
        .price-input { width: 90px !important; }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <div>
                <h2>Menu Management</h2>
                <div class="subtitle" th:if="${restaurant != null}" th:text="${restaurant.name()}">Restaurant</div>
            </div>
            <a th:href="@{/owner/owner_page}" class="back-link">Back to Owner Panel</a>
        </header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <!-- Add new item -->
        <div class="card">
            <h3>Add New Menu Item</h3>
            <form method="post" th:action="@{/owner/menu/items}" class="form-row">
                <div>
                    <label for="name">Name</label>
                    <input id="name" type="text" name="name" required placeholder="e.g. Margherita Pizza">
                </div>
                <div>
                    <label for="description">Description</label>
                    <input id="description" type="text" name="description" placeholder="Optional description">
                </div>
                <div>
                    <label for="price">Price (€)</label>
                    <input id="price" type="number" name="price" step="0.01" min="0.01" required placeholder="8.50">
                </div>
                <div>
                    <label for="available">Availability</label>
                    <select id="available" name="available">
                        <option value="true" selected>Available</option>
                        <option value="false">Unavailable</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn">Add Item</button>
                </div>
            </form>
        </div>

        <!-- Existing items in table-->
        <div class="card">
            <h3>Current Menu Items</h3>
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Status</th>
                        <th>Update Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items}">
                        <td>
                            <strong th:text="${item.name()}">Item</strong><br>
                            <small style="color: #6b7280;" th:text="${item.description()}"></small>
                        </td>
                        <td>
                            <span th:if="${item.available()}" class="badge-avail">Available</span>
                            <span th:unless="${item.available()}" class="badge-unavail">Unavailable</span>
                        </td>
                        <!--POST REQUEST THAT SPEAKS WITH THE OwnerMenuContoller.java-->
                        <td>
                            <form method="post" th:action="@{/owner/menu/items/{id}/price(id=${item.id()})}" class="inline-form">
                                <input type="number" name="price" step="0.01" min="0.01" th:value="${item.price()}" class="price-input" required>
                                <button type="submit" class="btn btn-secondary">Save</button>
                            </form>
                        </td>
                        <td>
                            <form method="post" th:action="@{/owner/menu/items/{id}/availability(id=${item.id()})}" class="inline-form">
                                <input type="hidden" name="available" th:value="${!item.available()}">
                                <button type="submit" class="btn" th:text="${item.available()} ? 'Mark Unavailable' : 'Mark Available'">
                                </button>
                            </form>

                            <form method="post" th:action="@{/owner/menu/items/{id}/delete(id=${item.id()})}" class="inline-form" onsubmit="return confirm('Delete this item?');">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="4" style="color: #6b7280;">No items in this menu yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
